<!DOCTYPE html>
<html>
<body style="font-family: Arial, sans-serif; background-color: #f9fafb; padding: 20px;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 30px; border-radius: 8px; border-top: 5px solid #15803d; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
        <h2 style="color: #111827; margin-bottom: 20px;">Update from {{ producer_name }}</h2>
        <p>Hello {{ customer_name }},</p>
        <p>{{ producer_name }} just shared a new <strong>{{ post.get_post_type_display }}</strong> with the community!</p>
        
        <div style="background-color: #f0fdf4; border-left: 4px solid #15803d; padding: 15px; margin: 20px 0;">
            <h3 style="margin: 0 0 10px 0; color: #166534;">{{ post.title }}</h3>
            <p style="margin: 0; color: #14532d; font-size: 15px; white-space: pre-wrap;">{{ post.content }}</p>
        </div>

        <a href="http://localhost:8000/marketplace/community/" style="display: inline-block; background-color: #15803d; color: #ffffff; padding: 12px 24px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px;">View in Community Feed</a>
        
        <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 30px 0;">
        <p style="font-size: 12px; color: #6b7280; text-align: center;">You are receiving this because you are subscribed to {{ producer_name }}.</p>
    </div>
</body>
</html>
