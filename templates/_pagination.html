{% load query_params %}

{% if page_obj.has_other_pages %}
<div class="flex justify-center mt-12 mb-8 pagination-container">
    <nav class="inline-flex items-center -space-x-px rounded-md shadow-sm bg-white border border-gray-300" aria-label="Pagination">
        
        {% if page_obj.has_previous %}
            <a href="?{% url_replace request 'page' page_obj.previous_page_number %}" 
               class="pagination-link px-3 py-2 text-gray-500 hover:bg-gray-50 rounded-l-md border-r"
               data-page="{{ page_obj.previous_page_number }}">
                &laquo; Previous
            </a>
        {% endif %}

        <span class="px-4 py-2 text-sm font-medium text-gray-700 bg-green-50">
            Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}
        </span>

        {% if page_obj.has_next %}
            <a href="?{% url_replace request 'page' page_obj.next_page_number %}" 
               class="pagination-link px-3 py-2 text-gray-500 hover:bg-gray-50 rounded-r-md border-l"
               data-page="{{ page_obj.next_page_number }}">
                Next &raquo;
            </a>
        {% endif %}

    </nav>
</div>
{% endif %}
